<!doctype html>
<html lang="en" data-family="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Your stats across every game, from this device." />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121825" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/src/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="color-scheme" content="light dark" />
    <!-- Hidden: nothing links here, and it stays out of search results. -->
    <meta name="robots" content="noindex" />
    <!-- Sets the theme the player picked before the first paint; see src/theme.ts. -->
    <script>try{var t=localStorage.getItem('games.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- The paper colour from base.css, so the page never shows the browser's white canvas while the stylesheet loads. -->
    <style>html { background: #eef2f7; } @media (prefers-color-scheme: dark) { html { background: #121825; } }</style>
    <link rel="stylesheet" href="/src/stats/style.css" />
    <title>Your stats</title>
  </head>
  <body>
    <div id="app">
      <main class="screen stats ink-blue">
        <header class="topbar">
          <a class="icon-btn" href="/" aria-label="All games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </a>
          <h1 class="topbar-title">Your stats</h1>
          <span class="icon-btn" aria-hidden="true"></span>
        </header>

        <p id="totals" class="stats-totals" aria-live="polite">Counting…</p>

        <div id="empty" class="stats-empty" hidden>
          <p>Play a few games and your stats appear here.</p>
          <p class="muted">Everything is counted on this device only, and never leaves it.</p>
        </div>

        <div id="activity" hidden>
          <h2 class="section-label">Last 17 weeks</h2>
          <div class="stats-sheet">
            <div id="calendar" class="calendar" role="img"></div>
            <div class="calendar-key muted" aria-hidden="true"><span>Less</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><span>More</span></div>
          </div>

          <h2 class="section-label">Time of day</h2>
          <div class="stats-sheet">
            <div id="hours" class="hours" role="img"></div>
            <div class="hours-axis muted" aria-hidden="true"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>
          </div>

          <h2 class="section-label">Top games</h2>
          <div id="top" class="stats-sheet top-games"></div>

          <h2 class="section-label">Highlights</h2>
          <dl id="highlights" class="stats-sheet highlights"></dl>
        </div>

        <nav id="games" class="games stats-games" aria-label="Every game"></nav>

        <p class="stats-foot muted">Counted on this device only. Nothing is sent anywhere.</p>
      </main>

      <dialog id="game-dialog" class="dialog stats-dialog" aria-labelledby="game-dialog-title">
        <h2 id="game-dialog-title"></h2>
        <div id="game-dialog-body" class="stats-detail"></div>
        <div class="dialog-actions one">
          <button id="game-dialog-close" class="btn btn-primary">Done</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/stats/main.ts"></script>
  </body>
</html>
