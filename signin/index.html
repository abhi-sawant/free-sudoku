<!doctype html>
<html lang="en" data-family="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sign in to keep your progress on every device." />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121825" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/src/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <!-- Sets the theme the player picked before the first paint; see src/theme.ts. -->
    <script>try{var t=localStorage.getItem('games.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- The paper colour from base.css, so the page never shows the browser's white canvas while the stylesheet loads. -->
    <style>html { background: #eef2f7; } @media (prefers-color-scheme: dark) { html { background: #121825; } }</style>
    <link rel="stylesheet" href="/src/account/style.css" />
    <title>Sign in</title>
  </head>
  <body>
    <div id="app">
      <main class="screen account ink-blue">
        <header class="topbar">
          <a class="icon-btn" href="/" aria-label="All games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </a>
          <h1 class="topbar-title" id="page-title">Sign in</h1>
          <span class="icon-btn" aria-hidden="true"></span>
        </header>
        <p class="account-lead">Sign in to keep your progress and pick it up on any device. The games always work without an account.</p>
        <form id="form" class="account-form" novalidate>
            <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required /></label>
            <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required /></label>
          <p id="error" class="form-error" role="alert" hidden></p>
          <button id="submit" class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <p class="account-links"><a href="/forgot/index.html">Forgot password?</a><a href="/signup/index.html">Create an account</a></p>
        <p id="notice" class="form-note" role="status" hidden></p>
      </main>
    </div>
    <script type="module" src="/src/account/signin.ts"></script>
  </body>
</html>
