<!doctype html>
<html lang="en" data-family="cocoa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Free offline Qubo: time your tap to jump from a tipping tower to the next." />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121825" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/src/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the theme the player picked before the first paint; see src/theme.ts. -->
    <script>try{var t=localStorage.getItem('games.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- The paper colour from base.css, so the page never shows the browser's white canvas while the stylesheet loads. -->
    <style>html { background: #eef2f7; } @media (prefers-color-scheme: dark) { html { background: #121825; } }</style>
    <link rel="stylesheet" href="/src/qubo/style.css" />
    <title>Qubo</title>
  </head>
  <body>
    <div id="app">
      <!-- Home -->
      <section id="home" class="screen">
        <div class="home-inner">
          <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            <span>All games</span>
          </a>
          <h1 class="logo">Qubo</h1>
          <p class="tagline">The tower tips over like a pendulum. Time your tap to throw the cube onto the next tower before it falls.</p>

          <div class="levels">
            <button id="play-btn" class="btn btn-primary continue"><span>Play</span><small id="home-best"></small></button>
          </div>

          <a class="btn history-link" href="/howto/index.html?g=qubo">
            <span>How to play</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </a>
        </div>
      </section>

      <!-- Unused, but the shared screens expect it -->
      <section id="history" class="screen" hidden></section>

      <!-- Game -->
      <section id="game" class="screen" hidden>
        <header class="topbar">
          <button id="back-btn" class="icon-btn" aria-label="Back to menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <div class="meta">
            <b>Qubo</b>
            <span>Best <span id="best"></span></span>
          </div>
          <div class="score"><b id="score" aria-label="Score">0</b><span>Score</span></div>
        </header>

        <div class="board-wrap">
          <div class="board-frame">
            <canvas id="stage" role="img" aria-label="Qubo: tap, click, or press Space to jump off the tipping tower"></canvas>
            <p id="status" class="stage-status" aria-live="polite"></p>
          </div>
          <button id="hold-btn" class="btn btn-primary hold-btn">Jump</button>
        </div>
      </section>

      <!-- Run over -->
      <dialog id="end-dialog" class="dialog">
        <h2>Splash!</h2>
        <p id="end-summary"></p>
        <div class="dialog-actions">
          <button id="end-menu" class="btn">Menu</button>
          <button id="end-again" class="btn btn-primary">Play again</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/qubo/main.ts"></script>
  </body>
</html>
