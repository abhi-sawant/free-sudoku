<!doctype html>
<html lang="en" data-family="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Global leaderboards for each game." />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121825" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/src/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the theme the player picked before the first paint; see src/theme.ts. -->
    <script>try{var t=localStorage.getItem('games.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- The paper colour from base.css, so the page never shows the browser's white canvas while the stylesheet loads. -->
    <style>html { background: #eef2f7; } @media (prefers-color-scheme: dark) { html { background: #121825; } }</style>
    <link rel="stylesheet" href="/src/leaderboard/style.css" />
    <title>Leaderboards</title>
  </head>
  <body>
    <div id="app">
      <main id="screen" class="screen lb-page ink-blue">
        <header class="topbar">
          <a class="icon-btn" href="/" aria-label="All games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </a>
          <h1 class="topbar-title">Leaderboards</h1>
          <span class="icon-btn" aria-hidden="true"></span>
        </header>

        <label class="lb-pick"><span class="section-label">Game</span>
          <select id="game-pick"></select>
        </label>
        <div id="variants" class="lb-variants" role="group" aria-label="Level"></div>

        <p id="status" class="lb-status muted" role="status" aria-live="polite">Loading…</p>
        <table id="board" class="summary lb-table" hidden>
          <thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col" id="value-head">Best</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="me" class="lb-me" hidden></p>

        <p class="lb-foot muted">Signed-in players' best results are shared here with their name. <a href="/account/index.html">Opt out in your account.</a></p>
      </main>
    </div>
    <script type="module" src="/src/leaderboard/main.ts"></script>
  </body>
</html>
